name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Install dependencies
        run: |
          rm -f .yarnclean yarn.lock
          yarn install --frozen-lockfile
      - name: Install Pandoc
        run: sudo apt-get install -y pandoc
      - name: Hexo Generate
        run: |
          yarn run hexo clean
          yarn run hexo generate
      - name: Diagnose generated site
        run: |
          echo "=== public directory listing ==="
          ls -la ./public || true
          echo "=== size ==="
          du -sh ./public || true
          echo "=== file count ==="
          find ./public -type f | wc -l || true
          echo "=== CNAME ==="
          [ -f ./public/CNAME ] && echo "CNAME FOUND:" && cat ./public/CNAME || echo "No CNAME file"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
